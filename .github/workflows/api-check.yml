name: api-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() { echo "=== $1"; curl -s -m 30 -D - -H 'Origin: https://friday-relay.mcioroianu2.workers.dev' "$1" -o body.txt | grep -i -E '^(HTTP|access-control|content-type)'; head -c ${2:-1500} body.txt; echo; }
          check "https://opendata.elia.be/api/explore/v2.1/catalog/datasets/ods191/records?limit=4" 3000
          check "https://opendata.elia.be/api/explore/v2.1/catalog/datasets/ods191/records?limit=2&order_by=-datetime" 1500
          check "https://api.energy-charts.info/signal?country=be" 1500
          check "https://openholidaysapi.org/SchoolHolidays?countryIsoCode=BE&subdivisionCode=BE-FR&validFrom=2026-06-01&validTo=2027-12-31&languageIsoCode=EN" 5000
