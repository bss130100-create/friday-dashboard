name: gpsjam
# Refresh data/gpsjam.json once a day (GPSJam publishes the previous day's map each morning UTC).
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install h3==4.*
      - run: python scripts/gpsjam.py data/gpsjam.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gpsjam.json
          git diff --cached --quiet || (git commit -m "Update GPS jamming data" && git push)
